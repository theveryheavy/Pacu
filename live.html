<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Pacu live board</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #111318;
        color: #f1f3f5;
      }

      body {
        margin: 0;
        padding: 1.5rem 1rem;
      }

      main {
        width: min(100%, 400px);
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
      }

      p {
        color: #c3c8d1;
      }

      a {
        color: #9dc2ff;
      }

      #board {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        width: 100%;
        aspect-ratio: 1;
        overflow: hidden;
        border-radius: 4px;
      }

      #board[hidden] {
        display: none;
      }

      .square {
        display: grid;
        place-items: center;
        font-size: clamp(1.7rem, 9vw, 3rem);
        line-height: 1;
      }

      .light {
        background: #f0d9b5;
      }

      .dark {
        background: #b58863;
      }

      .white-piece {
        color: #fffdf6;
        -webkit-text-stroke: 1px #27221e;
        text-shadow: 1px 2px 1px #27221e;
      }

      .black-piece {
        color: #211e1b;
        text-shadow: 0 1px 1px #fff3;
      }

      .message {
        min-height: 1.5em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Pacu live board</h1>
      <p class="message" id="status" role="status">Checking for a game…</p>
      <div id="board" role="img" aria-label="Pacu's current chess game" hidden></div>
      <p><a href="https://lichess.org/@/Pacu_Bot/tv">Open Pacu's Lichess page</a></p>
    </main>
    <script type="module">
      import { Chess } from "https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm";

      const status = document.getElementById("status");
      const boardElement = document.getElementById("board");
      const currentGameUrl = "https://lichess.org/api/user/Pacu_Bot/current-game";
      const pieces = {
        w: { k: "♔", q: "♕", r: "♖", b: "♗", n: "♘", p: "♙" },
        b: { k: "♚", q: "♛", r: "♜", b: "♝", n: "♞", p: "♟" },
      };

      function renderBoard(chess, blackAtBottom) {
        const position = chess.board();
        const ranks = blackAtBottom ? [0, 1, 2, 3, 4, 5, 6, 7] : [7, 6, 5, 4, 3, 2, 1, 0];
        const files = blackAtBottom ? [7, 6, 5, 4, 3, 2, 1, 0] : [0, 1, 2, 3, 4, 5, 6, 7];
        boardElement.replaceChildren();

        for (const [row, rank] of ranks.entries()) {
          for (const [column, file] of files.entries()) {
            const square = document.createElement("div");
            square.className = `square ${(row + column) % 2 ? "dark" : "light"}`;
            const piece = position[rank][file];

            if (piece) {
              const glyph = document.createElement("span");
              glyph.className = piece.color === "w" ? "white-piece" : "black-piece";
              glyph.textContent = pieces[piece.color][piece.type];
              square.append(glyph);
            }

            boardElement.append(square);
          }
        }

        boardElement.hidden = false;
      }

      async function refresh() {
        try {
          const response = await fetch(`${currentGameUrl}?_=${Date.now()}`, { cache: "no-store" });

          if (response.status === 404) {
            boardElement.hidden = true;
            status.textContent = "Pacu is not currently playing. Checking again shortly.";
            return;
          }

          if (!response.ok) throw new Error(`Lichess returned ${response.status}`);

          const pgn = await response.text();
          const chess = new Chess();
          chess.loadPgn(pgn);
          const result = pgn.match(/^\[Result "([^"]+)"\]$/m)?.[1];
          const white = pgn.match(/^\[White "([^"]+)"\]$/m)?.[1];
          const black = pgn.match(/^\[Black "([^"]+)"\]$/m)?.[1];

          if (!white || !black) throw new Error("The current game response is missing player names");
          if (result && result !== "*") {
            boardElement.hidden = true;
            status.textContent = "Pacu is not currently playing. Checking again shortly.";
            return;
          }

          const blackAtBottom = black.toLowerCase() === "pacu_bot";
          renderBoard(chess, blackAtBottom);
          status.textContent = `${white} vs ${black} · ${Math.ceil(chess.history().length / 2)} moves · updates every 15 seconds`;
        } catch {
          status.textContent = "Couldn't refresh Pacu's game. Retrying shortly.";
        } finally {
          window.setTimeout(refresh, 15_000);
        }
      }

      refresh();
    </script>
  </body>
</html>
