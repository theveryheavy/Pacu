<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Pacu live board</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #111318;
        color: #f1f3f5;
      }

      body {
        margin: 0;
        padding: 1.5rem 1rem;
      }

      main {
        width: min(100%, 360px);
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
      }

      p {
        color: #c3c8d1;
      }

      a {
        color: #9dc2ff;
      }

      iframe {
        width: 100%;
        aspect-ratio: 10 / 11;
        border: 0;
      }

      iframe[hidden],
      #game-link[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Pacu live board</h1>
      <p id="status" role="status">Checking for a game…</p>
      <p><a id="game-link" href="https://lichess.org/@/Pacu_Bot/tv" hidden>Open on Lichess</a></p>
      <iframe id="board" title="Pacu's live chess game on Lichess" allowtransparency="true" hidden></iframe>
    </main>
    <script>
      const status = document.getElementById("status");
      const board = document.getElementById("board");
      const gameLink = document.getElementById("game-link");
      const currentGameUrl = "https://lichess.org/api/user/Pacu_Bot/current-game";
      let gameId = null;

      async function refresh() {
        try {
          const response = await fetch(currentGameUrl, { cache: "no-store" });

          if (response.status === 404) {
            board.src = "about:blank";
            board.hidden = true;
            gameLink.hidden = true;
            gameId = null;
            status.textContent = "Pacu is not currently playing.";
            return;
          }

          if (!response.ok) throw new Error(`Lichess returned ${response.status}`);

          const pgn = await response.text();
          const match = pgn.match(/^\[GameId "([A-Za-z0-9]{8})"\]$/m);
          if (!match) throw new Error("The current game response did not contain a valid game ID");

          if (match[1] !== gameId) {
            gameId = match[1];
            board.src = `https://lichess.org/embed/game/${gameId}?theme=brown&bg=dark`;
            board.hidden = false;
            gameLink.href = `https://lichess.org/game/${gameId}`;
            gameLink.hidden = false;
          }

          status.textContent = "Pacu's current game. The board updates live.";
        } catch {
          status.textContent = "Couldn't refresh the game right now. Retrying shortly.";
        } finally {
          window.setTimeout(refresh, 30_000);
        }
      }

      refresh();
    </script>
  </body>
</html>
